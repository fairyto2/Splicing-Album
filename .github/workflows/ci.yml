name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: '' }
      - name: Fail fast if lockfile pins a private/LAN registry
        run: |
          if grep -qE '"resolved": "https?://(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)' package-lock.json; then
            echo "::error::package-lock.json pins a private/LAN registry (e.g. 10.x.x.x). Regenerate it against the public registry and commit: npm install --registry=https://registry.npmjs.org/"
            exit 1
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: '' }
      - name: Fail fast if lockfile pins a private/LAN registry
        run: |
          if grep -qE '"resolved": "https?://(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)' package-lock.json; then
            echo "::error::package-lock.json pins a private/LAN registry (e.g. 10.x.x.x). Regenerate it against the public registry and commit: npm install --registry=https://registry.npmjs.org/"
            exit 1
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:run

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: '' }
      - name: Fail fast if lockfile pins a private/LAN registry
        run: |
          if grep -qE '"resolved": "https?://(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)' package-lock.json; then
            echo "::error::package-lock.json pins a private/LAN registry (e.g. 10.x.x.x). Regenerate it against the public registry and commit: npm install --registry=https://registry.npmjs.org/"
            exit 1
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build

  build-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: '' }
      - name: Fail fast if lockfile pins a private/LAN registry
        run: |
          if grep -qE '"resolved": "https?://(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)' package-lock.json; then
            echo "::error::package-lock.json pins a private/LAN registry (e.g. 10.x.x.x). Regenerate it against the public registry and commit: npm install --registry=https://registry.npmjs.org/"
            exit 1
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:desktop

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: '' }
      - name: Fail fast if lockfile pins a private/LAN registry
        run: |
          if grep -qE '"resolved": "https?://(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)' package-lock.json; then
            echo "::error::package-lock.json pins a private/LAN registry (e.g. 10.x.x.x). Regenerate it against the public registry and commit: npm install --registry=https://registry.npmjs.org/"
            exit 1
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }

      - uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: '36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: false

      - run: cd android && ./gradlew :app:assembleDebug
